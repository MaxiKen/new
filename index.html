<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Blog Platform">
  <title>Blog</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    #loading-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#1e3a5f,#3b82f6);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .3s}
    .ls-logo{width:80px;height:80px;margin-bottom:20px;animation:pulse 2s infinite}
    .ls-text{color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:6px}.ls-text span{color:#f59e0b}
    .ls-sub{color:rgba(255,255,255,.7);font-size:.85rem;margin-bottom:24px}
    .ls-spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:#f59e0b;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .hero{background:var(--primary,#3b82f6);background-size:cover;background-position:center;position:relative}
    .hero::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45)}
    .hero-content{position:relative;z-index:1}
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <svg class="ls-logo" viewBox="0 0 192 192" fill="none"><rect width="192" height="192" rx="40" fill="#3b82f6"/><rect x="40" y="60" width="112" height="12" rx="6" fill="white"/><rect x="40" y="84" width="80" height="12" rx="6" fill="white" opacity="0.8"/><rect x="40" y="108" width="96" height="12" rx="6" fill="white" opacity="0.6"/></svg>
    <div class="ls-text" id="ls-text">Loading</div>
    <div class="ls-sub">Please wait...</div>
    <div class="ls-spin"></div>
  </div>

  <!-- Offline Banner -->
  <div id="offline-banner" class="offline-banner">You are offline. Pull down to refresh when back online.</div>

  <!-- Pull to Refresh -->
  <div id="pull-to-refresh" class="pull-to-refresh"><div class="pull-to-refresh-spinner"></div><span>Refreshing...</span></div>

  <!-- Header -->
  <header class="header" id="header">
    <div class="header-inner">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
        <a href="#/" class="header-logo" onclick="App.go('/')"><img id="site-logo" src="" alt="" style="display:none;height:32px"><span class="header-logo-text" id="site-name">Blog</span></a>
      </div>
      <nav class="desktop-nav" id="desktop-nav"></nav>
      <div class="header-actions">
        <button class="header-btn" id="search-btn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <button class="header-btn" id="theme-toggle" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg></button>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span style="font-weight:700;font-size:1.25rem">Menu</span>
      <button class="sidebar-close" id="sidebar-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <nav class="nav-menu" id="nav-menu"></nav>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Search Modal -->
  <div class="search-modal" id="search-modal">
    <div class="search-header">
      <div class="search-input-wrapper">
        <div class="search-input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
        <input type="text" class="search-input" id="search-input" placeholder="Search...">
      </div>
      <button class="search-close" id="search-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="search-results" id="search-results"><div class="search-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><h3>Start typing to search</h3></div></div>
  </div>

  <!-- Main Content -->
  <main class="main-content" id="main-content"></main>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <!-- Contact FAB -->
  <button class="fab-contact" id="fab-contact" aria-label="Contact"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>

  <!-- Contact Modal -->
  <div class="contact-modal" id="contact-modal">
    <div class="contact-modal-header">
      <span class="contact-modal-title">Contact Us</span>
      <button class="contact-modal-close" id="contact-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form class="contact-form" id="contact-form">
      <div class="form-group"><label class="form-label">Name</label><input type="text" class="form-input" name="name" required></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" name="email" required></div>
      <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" name="message" required></textarea></div>
      <button type="submit" class="form-submit">Send Message</button>
    </form>
  </div>

  <!-- Back to Top -->
  <button class="back-to-top" id="back-to-top" aria-label="Top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="env.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/content.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
